# Builds the Android app (APK) and publishes the web app — runs on every push to "main".
name: Build 9Wings app

on:
  push:
    branches: [main]
    paths-ignore:
      - 'notices/**'
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new in this version (shown to users)"
        required: false
        default: ''
      required:
        description: 'Make this version required (users must update)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#FAF7F1' --splashBackgroundColor '#FAF7F1'
          mkdir -p android/app/src/main/res/drawable
          cp assets/ic_stat_9wings.png android/app/src/main/res/drawable/ic_stat_9wings.png
          # notification permission (Android 13+)
          grep -q POST_NOTIFICATIONS android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          # version number goes up with every build so updates install over the old app
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the KEYSTORE_BASE64 secret (see SETUP-GUIDE.md, step 2)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias ninewings --ks-pass pass:NineWings2026 --key-pass pass:NineWings2026 --out 9Wings-Event.apk aligned.apk
          $BT/apksigner verify 9Wings-Event.apk
          rm release.jks

      - name: Release notes
        env:
          NOTES: ${{ github.event.inputs.notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES" > notes.md
          else printf '%s\n' "$COMMIT_MSG" | grep -viE '^(co-authored-by|claude-session):' | sed '/^$/N;/^\n$/D' > notes.md; fi
          [ -s notes.md ] || echo "Improvements and fixes." > notes.md
          cat notes.md

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 9Wings Event 1.0.${{ github.run_number }}
          body_path: notes.md
          make_latest: true

      - name: Make this version required
        if: ${{ github.event.inputs.required == 'true' }}
        run: |
          V="1.0.${{ github.run_number }}"
          git config user.name "9Wings build"; git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git pull -q --rebase origin main
            mkdir -p notices; [ -f notices/notices.json ] || echo '{"minVersion":"","notices":[]}' > notices/notices.json
            jq --arg v "$V" --arg t "$(date -u +%FT%TZ)" '.minVersion=$v | .updatedAt=$t' notices/notices.json > n.tmp && mv n.tmp notices/notices.json
            git add notices/notices.json
            git commit -qm "Require version $V" || break
            git push -q origin HEAD:main && break
            sleep 5
          done
          files: 9Wings-Event.apk

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: QR code for the download page
        run: npx --yes qrcode@1.5.4 -t svg -w 300 -q 1 -o www/img/download-qr.svg "https://sheranr.github.io/9wings-app/download/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

  publish-web:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
